name: CI

# Tourne sur chaque push, quelle que soit la branche : le retour n'est plus
# conditionné à l'existence d'une pull request ouverte.
on:
    push:
    pull_request:

# Un push sur une branche liée à une PR ouverte émet deux événements pour le
# même commit. Le groupe de concurrence les fusionne au lieu de payer deux runs.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7
